# Every skill must be discoverable by `npx skills`, and skills/cli/ must match
# what the pinned @ocpplab/cli generates.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generated CLI skills are current
        run: node scripts/generate-cli-skills.mjs --check

      - name: Every skill is discoverable
        run: |
          expected=$(find skills -name SKILL.md | wc -l)
          found=$(npx -y skills@1.7.2 add . --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -nE 's/.*Found ([0-9]+) skills.*/\1/p' | head -1)
          echo "SKILL.md files: $expected, discovered: ${found:-0}"
          [ "${found:-0}" -eq "$expected" ]
